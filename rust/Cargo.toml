[package]
name = "ntfy-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ntfy_core"
crate-type = ["staticlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
    "charset",
    "gzip",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

[profile.release]
opt-level = 2